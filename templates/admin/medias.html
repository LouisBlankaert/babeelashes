<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Babeelashes — Photos</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family:'Inter',sans-serif; background:#FDF8F5; color:#2A1A20; }
    .font-serif { font-family:'Playfair Display',serif; }

    .media-grid {
      display:grid; gap:12px;
      grid-template-columns: repeat(2, 1fr);
    }
    @media (min-width: 640px)  { .media-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1024px) { .media-grid { grid-template-columns: repeat(4, 1fr); } }

    .media-card {
      background:#fff; border-radius:16px; overflow:hidden;
      border:1px solid rgba(212,132,154,0.18);
      box-shadow:0 2px 12px rgba(212,132,154,0.06);
    }
    .media-thumb {
      position:relative; aspect-ratio: 4 / 5; background:#F7EFE8;
    }
    .media-thumb img, .media-thumb video {
      width:100%; height:100%; object-fit:cover; display:block;
    }
    .badge {
      position:absolute; top:8px; left:8px;
      font-size:0.65rem; font-weight:600; letter-spacing:0.04em; text-transform:uppercase;
      padding:3px 8px; border-radius:999px;
      background:rgba(255,255,255,0.92); color:#B8607A;
    }
    .badge-num { left:auto; right:8px; background:rgba(42,26,32,0.7); color:#fff; }

    .card-actions { display:flex; }
    .card-actions button {
      flex:1; height:44px; display:flex; align-items:center; justify-content:center;
      color:#B8607A; background:transparent; border:none; cursor:pointer;
      transition: background 0.15s;
    }
    .card-actions button + button { border-left:1px solid rgba(212,132,154,0.15); }
    .card-actions button:hover:not(:disabled) { background:rgba(242,197,208,0.25); }
    .card-actions button:disabled { color:#E5D5DA; cursor:default; }
    .card-actions .del { color:#EF4444; }

    .upload-btn {
      display:flex; align-items:center; justify-content:center; gap:0.6rem;
      width:100%; padding:1rem; border-radius:16px; cursor:pointer;
      font-weight:600; color:#fff;
      background:linear-gradient(135deg,#D4849A,#B8607A);
      box-shadow:0 6px 20px rgba(184,96,122,0.25);
    }

    .progress { height:6px; border-radius:999px; background:rgba(212,132,154,0.15); overflow:hidden; }
    .progress > div { height:100%; width:0; background:#D4849A; transition:width 0.2s; }

    #toast {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #2A1A20; color: #fff;
      padding: 0.75rem 1.5rem; border-radius: 999px;
      font-size: 0.85rem; font-weight: 500;
      opacity: 0; pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 200; max-width: calc(100vw - 2rem); text-align:center;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.error { background:#B91C1C; }
  </style>
</head>
<body class="min-h-screen">

  <!-- Header -->
  <header class="px-4 pt-4 pb-0 max-w-5xl mx-auto">
    <div class="flex items-center justify-between px-5 py-3 rounded-2xl"
         style="background:rgba(253,248,245,0.92); backdrop-filter:blur(20px); border:1px solid rgba(212,132,154,0.2); box-shadow:0 2px 20px rgba(212,132,154,0.08);">
      <p class="font-serif text-xl font-semibold hidden sm:block"
         style="background:linear-gradient(135deg,#F2C5D0,#D4849A,#B8607A);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">
        Babeelashes
      </p>
      <nav class="flex items-center gap-1 text-sm font-medium">
        <a href="/admin" class="px-3 py-1.5 rounded-lg transition-colors duration-200" style="color:#8A6070;">Agenda</a>
        <span class="px-3 py-1.5 rounded-lg" style="color:#2A1A20; background:rgba(242,197,208,0.35);">Photos</span>
      </nav>
      <a href="/admin/logout" class="text-xs px-3 py-1.5 rounded-lg cursor-pointer transition-colors duration-200"
         style="color:#D4849A; border:1px solid rgba(212,132,154,0.3);">
        Déconnexion
      </a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6">

    <div class="mb-5">
      <h1 class="font-serif text-2xl font-semibold">Photos &amp; vidéos du site</h1>
      <p class="text-sm mt-1" style="color:#8A6070;">
        Elles défilent dans cet ordre sur la page d'accueil. Les flèches changent l'ordre.
      </p>
    </div>

    <!-- Ajout -->
    <label class="upload-btn">
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Ajouter des photos ou vidéos
      <input id="file-input" type="file" accept="image/*,video/*" multiple class="hidden"/>
    </label>

    <div id="uploads" class="mt-4 space-y-3"></div>

    <!-- Liste -->
    <p id="empty" class="hidden text-center text-sm py-12" style="color:#8A6070;">
      Aucune photo pour l'instant. Le carrousel de la page d'accueil est vide.
    </p>
    <div id="grid" class="media-grid mt-6"></div>

    <p class="text-center text-xs mt-8">
      <a href="/" target="_blank" class="underline" style="color:#B8607A;">Voir le site</a>
    </p>
  </main>

  <div id="toast"></div>

<script>
  let items = [];

  const ICON_LEFT  = '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"/></svg>';
  const ICON_RIGHT = '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="9 18 15 12 9 6"/></svg>';
  const ICON_TRASH = '<svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';

  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.toggle('error', isError);
    t.classList.add('show');
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => t.classList.remove('show'), 4000);
  }

  async function load() {
    const r = await fetch('/api/admin/media');
    items = await r.json();
    render();
  }

  function render() {
    const grid = document.getElementById('grid');
    document.getElementById('empty').classList.toggle('hidden', items.length > 0);
    grid.innerHTML = '';
    items.forEach((m, i) => {
      const card = document.createElement('div');
      card.className = 'media-card';
      // #t=0.1 : force Safari iPhone à afficher la première image de la vidéo
      const thumb = m.is_video
        ? `<video src="${m.url}#t=0.1" muted playsinline preload="metadata"></video><span class="badge">Vidéo</span>`
        : `<img src="${m.url}" alt="" loading="lazy"/>`;
      card.innerHTML = `
        <div class="media-thumb">${thumb}<span class="badge badge-num">${i + 1}</span></div>
        <div class="card-actions">
          <button aria-label="Mettre avant" ${i === 0 ? 'disabled' : ''} data-move="-1">${ICON_LEFT}</button>
          <button aria-label="Mettre après" ${i === items.length - 1 ? 'disabled' : ''} data-move="1">${ICON_RIGHT}</button>
          <button aria-label="Supprimer" class="del" data-del>${ICON_TRASH}</button>
        </div>`;
      card.querySelector('[data-move="-1"]').onclick = () => move(i, -1);
      card.querySelector('[data-move="1"]').onclick  = () => move(i, 1);
      card.querySelector('[data-del]').onclick       = () => remove(m);
      grid.appendChild(card);
    });
  }

  async function move(i, dir) {
    const j = i + dir;
    if (j < 0 || j >= items.length) return;
    [items[i], items[j]] = [items[j], items[i]];
    render();
    const r = await fetch('/api/admin/media/order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids: items.map(m => m.id) }),
    });
    if (!r.ok) { showToast("L'ordre n'a pas pu être enregistré", true); load(); }
  }

  async function remove(m) {
    if (!confirm(m.is_video ? 'Supprimer cette vidéo du site ?' : 'Supprimer cette photo du site ?')) return;
    const r = await fetch(`/api/admin/media/${m.id}`, { method: 'DELETE' });
    if (!r.ok) { showToast('La suppression a échoué', true); return; }
    items = items.filter(x => x.id !== m.id);
    render();
    showToast('Supprimée du site');
  }

  // Envoi un fichier à la fois, avec une barre de progression (les vidéos sont lourdes)
  function upload(file) {
    return new Promise(resolve => {
      const row = document.createElement('div');
      row.className = 'text-sm';
      row.innerHTML = `
        <div class="flex justify-between mb-1" style="color:#8A6070;">
          <span class="truncate pr-3"></span><span class="pct">0 %</span>
        </div>
        <div class="progress"><div></div></div>`;
      row.querySelector('.truncate').textContent = file.name;
      document.getElementById('uploads').appendChild(row);
      const bar = row.querySelector('.progress > div');
      const pct = row.querySelector('.pct');

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/admin/media');
      xhr.upload.onprogress = e => {
        if (!e.lengthComputable) return;
        const p = Math.round(e.loaded / e.total * 100);
        bar.style.width = p + '%';
        pct.textContent = p + ' %';
      };
      // Fichier reçu : le serveur le prépare encore (une vidéo prend quelques secondes)
      xhr.upload.onload = () => { pct.textContent = 'Préparation…'; };
      xhr.onload = () => {
        row.remove();
        let data = {};
        try { data = JSON.parse(xhr.responseText); } catch (_) {}
        if (xhr.status === 200) {
          items.push(data);
          render();
          resolve(true);
        } else {
          showToast(`${file.name} : ${data.error || 'envoi impossible'}`, true);
          resolve(false);
        }
      };
      xhr.onerror = () => {
        row.remove();
        showToast(`${file.name} : connexion interrompue`, true);
        resolve(false);
      };
      const form = new FormData();
      form.append('file', file);
      xhr.send(form);
    });
  }

  document.getElementById('file-input').addEventListener('change', async e => {
    const files = Array.from(e.target.files);
    e.target.value = '';
    let ok = 0;
    for (const f of files) if (await upload(f)) ok++;
    if (ok) showToast(ok === 1 ? 'Ajoutée au site' : `${ok} fichiers ajoutés au site`);
  });

  load();
</script>
</body>
</html>
